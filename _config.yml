# Site configuration for daniel-a-fisch.github.io
#
# NOTE: this file is not reloaded by `jekyll serve` — restart after editing it.

title       : "Daniel A. Fisch"
description : "Daniel A. Fisch is a PhD student in Economics at MIT working on network economics, labour economics, and heterogeneous-agent macroeconomics."
url         : "https://daniel-a-fisch.github.io"
baseurl     : ""
locale      : "en_US"
timezone    : America/New_York

# No theme. This site is hand-written, but the github-pages gem otherwise falls
# back to jekyll-theme-primer and emits an unused 76 KB assets/css/style.css.
theme       :

# Build pages for future-dated documents. Needed because a forthcoming paper is
# a normal thing to list: with the default (false) Jekyll would show the item in
# the research list but skip its page, leaving a broken link.
future      : true

author:
  name          : "Daniel A. Fisch"
  role          : "PhD student in Economics"
  institution   : "Massachusetts Institute of Technology"
  location      : "Cambridge, MA"
  avatar        : "/images/Daniel-Fisch.jpg"
  # Obfuscated on purpose, to keep scrapers from harvesting it. Rendered as
  # plain text rather than a mailto: link — see _includes/contact.html.
  email         : "d_fisch [at] mit.edu"
  mit           : "https://economics.mit.edu/people/phd-students/daniel-fisch"
  orcid         : "https://orcid.org/0009-0007-2855-2578"
  github        : "https://github.com/daniel-a-fisch"
  linkedin      : "https://www.linkedin.com/in/daniel-fisch"
  cv            : "/files/CV_Daniel-Fisch.pdf"
  googlescholar :

# Top navigation. Order here is the order shown.
nav:
  - title: "Research"
    url: /research/
  - title: "Teaching"
    url: /teaching/
  - title: "CV"
    url: /cv/
  - title: "Reading"
    url: /reading-list/

collections:
  research:
    output: true
    permalink: /research/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: research
    values:
      layout: research

include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .bundle
  - .gems
  - .fakehome
  - node_modules

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  auto_ids: true
highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  disable: true
