# Site configuration for daniel-a-fisch.github.io
#
# This file is NOT reloaded automatically by `jekyll serve` — restart the
# server after editing it.


# Site Settings
locale                   : "en-US"
title                    : "Daniel A. Fisch"
title_separator          : "-"
name                     : "Daniel A. Fisch"
description              : "Daniel A. Fisch is a PhD student in Economics at MIT working on networks, labour, and heterogeneous-agent macroeconomics, with a background in theoretical physics and applied mathematics."
url                      : https://daniel-a-fisch.github.io
baseurl                  : ""
repository               : "daniel-a-fisch/daniel-a-fisch.github.io"
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"

comments:
  provider               : false

atom_feed:
  path                   :


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               :
og_image                 :
# Emitted as schema.org Person JSON-LD by _includes/seo.html, which is what
# search engines use to tie this site to the same person elsewhere. Add any
# further profiles (Google Scholar, ORCID) to `links` as they come online.
social:
  type                   : Person
  name                   : "Daniel A. Fisch"
  links:
    - https://economics.mit.edu/people/phd-students/daniel-fisch
    - https://orcid.org/0009-0007-2855-2578
    - https://github.com/daniel-a-fisch
    - https://www.linkedin.com/in/daniel-fisch


# Analytics
# Google Universal Analytics was shut down in 2023; leaving the provider blank
# emits no tracking code at all (see _includes/analytics.html). Adding GA4
# would require a new include — do not set this to "google-universal".
analytics:
  provider               : false


# Site Author
author:
  name             : "Daniel A. Fisch"
  avatar           : "Daniel-Fisch.jpg"
  bio              : "PhD student in Economics at MIT. I work on networks, labour, and heterogeneous-agent macroeconomics, with a background in theoretical physics and applied mathematics."
  employer         : "Massachusetts Institute of Technology"
  location         : "Cambridge, MA, USA"
  email            : "d_fisch [at] mit.edu"
  uri              : "https://economics.mit.edu/people/phd-students/daniel-fisch"
  orcid            : "https://orcid.org/0009-0007-2855-2578"
  github           : "daniel-a-fisch"
  linkedin         : "daniel-fisch"
  # Fill this in once there is a Scholar profile worth linking; the
  # /research/ page shows a link to it automatically when set.
  googlescholar    :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README.md
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - package-lock.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
#
# To add a working paper or a project, drop a single markdown file into the
# matching directory — no other edits are needed. See README.md for the
# front-matter fields each collection expects.
collections:
  research:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/


# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _research
  - scope:
      path: ""
      type: research
    values:
      layout: single
      author_profile: true
  # _projects
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
      read_time: false
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: America/New_York


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
